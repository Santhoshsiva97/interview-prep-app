# Judge0 CE 1.13.1 settings for local development (docker compose --profile judge).
# Full reference: https://github.com/judge0/judge0/blob/v1.13.1/judge0.conf
# Production: run Judge0 on its own hosts, set real passwords and AUTHN_TOKEN, and
# point the backend at it with CODE_RUNNER=judge0 + JUDGE0_URL + JUDGE0_AUTH_TOKEN.

# Auth: the backend sends X-Auth-Token (JUDGE0_AUTH_HEADER / JUDGE0_AUTH_TOKEN).
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=dev-judge0-token

# Sandbox limits (the backend never asks for more than these).
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=256000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=64
MAX_FILE_SIZE=4096
MAX_SUBMISSION_BATCH_SIZE=20
# No network access for candidate code.
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false
# We compare outputs ourselves; keep submissions small.
ENABLE_WAIT_RESULT=false
ENABLE_BATCHED_SUBMISSIONS=true
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

# Workers
INTERVAL=0.1
COUNT=4

# Judge0's own Postgres + Redis (separate from the app's).
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0-dev
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0-dev
