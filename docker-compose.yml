# Local development stack: postgres, redis, backend (NestJS), frontend (Vite).
# Usage: docker compose up --build   (see README.md)
name: interview-prep

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prep}
      POSTGRES_DB: ${POSTGRES_DB:-interview_prep}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for avatars/resumes. Console: http://localhost:9001
  minio:
    # Pinned: MinIO no longer publishes new community images.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-prep}:${POSTGRES_PASSWORD:-prep}@postgres:5432/${POSTGRES_DB:-interview_prep}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173
      # Dev-only default; override via JWT_ACCESS_SECRET in the root .env.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-dev-only-change-me-000}
      S3_ENDPOINT: http://minio:9000
      # Presigned URLs are opened by the browser, which reaches MinIO via localhost.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-interview-prep}
      # Poll for file changes — fs events don't cross Windows/macOS bind mounts.
      TSC_WATCHFILE: DynamicPriorityPolling
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app/backend
      - ./db:/app/db
      # Keep the container's own node_modules (Linux binaries) — don't mount the host's.
      - /app/backend/node_modules
      - /app/db/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
